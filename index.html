<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>My Daily Feed — Reading Library</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:white;padding:38px max(20px,calc((100vw - 960px)/2))}header small{letter-spacing:.16em;text-transform:uppercase;color:#b9c6de}h1{font-size:clamp(2rem,5vw,3.2rem);margin:10px 0}header p{max-width:620px;color:#d1d5db;line-height:1.6}main{max-width:960px;margin:40px auto;padding:0 20px}input{width:100%;padding:16px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;margin:12px 0 25px}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.item{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;min-height:146px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 9px #00000008}.item a{font-weight:700;font-size:1.15rem;text-decoration:none;color:#152c52}.item a:hover{text-decoration:underline}.meta{font-size:.82rem;color:#64748b;margin-top:12px}#message{color:#64748b;line-height:1.6}footer{max-width:960px;margin:60px auto 20px;padding:0 20px;font-size:.85rem;color:#64748b}</style></head><body><header><small>Independent learning library</small><h1>My Daily Feed</h1><p>Daily reading manuals, long-form lessons, and saved editions in one place.</p></header><main><h2>Reading archive</h2><input id="filter" type="search" aria-label="Search editions" placeholder="Search past readings…"><div id="items"></div><p id="message">Loading saved editions…</p></main><footer>Published from the Daily-feed GitHub repository.</footer><script>let feeds=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const term=document.getElementById('filter').value.toLowerCase(),found=feeds.filter(x=>(x.title+' '+x.path).toLowerCase().includes(term));document.getElementById('items').innerHTML=found.map(x=>'<article class="item"><a href="'+encodeURI(x.path).replace(/'/g,'%27')+'">'+esc(x.title)+'</a><div class="meta">'+esc(x.date||'Saved edition')+'</div></article>').join('');document.getElementById('message').textContent=found.length?'':(feeds.length?'No readings match that search.':'No individual HTML editions were found in the uploaded archive.');}document.getElementById('filter').addEventListener('input',render);fetch('./feeds.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{feeds=j;render()}).catch(()=>{document.getElementById('message').textContent='The archive index is not available yet.'});</script></body></html>
